name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema nltk scikit-learn pydantic sympy
      - name: Setup PHP application config and dependencies
        run: |
          cp app/config/config_sample.php app/config/config.php
          composer install --no-interaction --prefer-dist --no-progress
      - name: Download NLTK datasets
        run: |
          python -m nltk.downloader punkt punkt_tab stopwords wordnet
      - name: Run pytest
        run: python -m pytest tests/ -v
