name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema nltk scikit-learn pydantic
      - name: Download NLTK datasets
        run: |
          python -m nltk.downloader punkt punkt_tab stopwords wordnet
      - name: Run pytest
        run: python -m pytest tests/ -v
